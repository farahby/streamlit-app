name: Auto Retrain Layer 9

on:
  repository_dispatch:
    types: [analyst_feedback_submitted]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install supabase pandas numpy xgboost lightgbm scikit-learn

      - name: Run retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python retrain.py

      - name: Commit updated scores
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add normalized_alerts/scored_findings.csv mae_history.json
          git diff --cached --quiet || git commit -m "auto: Layer 9 retrain $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
